<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuroraAgent</title>
    <script>
      // 主题预置：在首帧绘制前定好 data-theme，避免深色底闪一下白（或反之）。
      // 与 src/theme.ts 同一套键名与判定；存储不可用时退回深色。
      (function () {
        try {
          var pref = localStorage.getItem('auroraagent.theme');
          var dark = pref === 'dark' ||
            ((pref === 'system' || pref === null) && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <script type="module" crossorigin src="/app/assets/index-ksN9X9sO.js"></script>
    <link rel="stylesheet" crossorigin href="/app/assets/index-DTeg3t5r.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
