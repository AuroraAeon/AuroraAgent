<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ModelTester</title>
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="stylesheet" href="/providers.css">
<style>
  :root {
    --bg:#0e1014; --panel:#151820; --surface:#1b1f2a; --surface-hover:#232936;
    --line:#2a3040; --text:#e8ebf2; --dim:#8b93a7;
    --accent:#ffd100; --accent-soft:rgb(255 209 0 / 14%); --accent-line:rgb(255 209 0 / 45%); --accent-ink:#1a1c20;
    --think:#5ec8d8; --danger:#ff6b6b; --danger-bg:rgb(255 107 107 / 12%);
    --radius:14px;
    --ease:cubic-bezier(.22,.9,.28,1);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  [hidden] { display:none !important; }
  html { color-scheme:dark; }
  body {
    background:var(--bg); color:var(--text);
    font:15px/1.65 -apple-system,"PingFang SC","SF Pro Text","Helvetica Neue",Arial,sans-serif;
    height:100vh; display:flex; flex-direction:column; overflow:hidden;
  }
  ::selection { background:rgb(255 209 0 / 28%); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

  /* ---------- 氛围光斑（缓慢漂移，reduced-motion 时静止） ---------- */
  .aurora { position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
  .aurora::before {
    content:''; position:absolute; left:50%; top:-42%; width:130vmax; height:130vmax;
    transform:translateX(-50%);
    background:radial-gradient(closest-side, rgb(255 209 0 / 6.5%), transparent 72%);
    animation:drift 26s ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { transform:translateX(-50%) translateY(0) scale(1); }
    to   { transform:translateX(-53%) translateY(7%) scale(1.14); }
  }

  /* ---------- 顶栏（毛玻璃 + 入场） ---------- */
  header {
    padding:12px 22px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:12px; flex:none;
    background:rgb(21 24 32 / 82%); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    animation:drop-in .5s var(--ease) both;
  }
  @keyframes drop-in { from { opacity:0; transform:translateY(-10px); } }
  .brand { display:flex; align-items:center; gap:11px; min-width:0; }
  .brand-mark {
    width:32px; height:32px; border-radius:9px; flex:none; display:block;
    box-shadow:0 2px 10px rgb(255 195 0 / 22%);
    transition:transform .25s var(--ease);
  }
  .brand:hover .brand-mark { transform:rotate(-4deg) scale(1.05); }
  .brand-text { display:flex; flex-direction:column; line-height:1.25; min-width:0; }
  .brand-text h1 { font-size:15.5px; font-weight:650; letter-spacing:.2px; }
  .brand-sub { color:var(--dim); font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header .meta { margin-left:auto; display:flex; gap:10px; align-items:center; }

  /* ---------- 开关 ---------- */
  .switch { display:inline-flex; align-items:center; gap:8px; cursor:pointer; user-select:none; color:var(--dim); font-size:13px; }
  .switch:hover { color:var(--text); }
  .switch input { position:absolute; opacity:0; width:0; height:0; }
  .switch .track {
    width:34px; height:20px; border-radius:999px; flex:none; position:relative;
    background:var(--surface-hover); border:1px solid var(--line);
    transition:background-color .2s var(--ease), border-color .2s var(--ease), box-shadow .2s;
  }
  .switch .knob {
    position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%;
    background:var(--dim); transition:transform .22s var(--ease), background-color .22s;
  }
  .switch input:checked + .track { background:var(--accent-soft); border-color:var(--accent-line); }
  .switch input:checked + .track .knob { transform:translateX(14px); background:var(--accent); }
  .switch input:focus-visible + .track { box-shadow:0 0 0 2px var(--accent); }
  .switch input:disabled + .track { opacity:.5; }

  /* ---------- 图标按钮 ---------- */
  .iconbtn {
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    background:var(--surface); border:1px solid var(--line); color:var(--text);
    border-radius:10px; height:34px; min-width:34px; padding:0 9px; cursor:pointer;
    transition:background-color .15s, border-color .15s, transform .12s var(--ease), color .15s;
  }
  .iconbtn:hover { background:var(--surface-hover); border-color:#39415a; }
  .iconbtn:active { transform:scale(.94); }
  .iconbtn svg { width:17px; height:17px; flex:none; }
  .iconbtn.danger { color:var(--danger); border-color:rgb(255 107 107 / 35%); background:var(--danger-bg); }
  .iconbtn.danger:hover { background:rgb(255 107 107 / 20%); }
  .iconbtn.lg { height:42px; min-width:42px; border-radius:12px; }

  /* ---------- 模型选择器 ---------- */
  .msel { position:relative; }
  .msel-trigger {
    display:inline-flex; align-items:center; gap:8px; height:34px; padding:0 11px;
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    color:var(--text); font-size:13px; cursor:pointer; max-width:250px;
    transition:background-color .15s, border-color .15s, transform .12s var(--ease);
  }
  .msel-trigger:hover { background:var(--surface-hover); border-color:#39415a; }
  .msel-trigger:active { transform:scale(.97); }
  .msel-trigger svg { width:14px; height:14px; flex:none; }
  .msel-ico { color:var(--accent); display:inline-flex; }
  .msel-ico img { width:15px; height:15px; border-radius:4px; display:block; flex:none; }
  .msel-label { font-weight:550; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .msel-tag {
    font-size:10.5px; color:var(--accent); background:var(--accent-soft);
    border:1px solid var(--accent-line); border-radius:999px; padding:1px 7px; flex:none;
  }
  .msel-chev { color:var(--dim); display:inline-flex; transition:transform .2s var(--ease); }
  .msel-trigger[aria-expanded="true"] .msel-chev { transform:rotate(180deg); }
  .msel-menu {
    position:fixed; z-index:60; min-width:230px; max-width:300px;
    background:rgb(27 31 42 / 96%); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid #333b52; border-radius:13px; padding:6px;
    box-shadow:0 16px 48px rgb(0 0 0 / 45%), 0 2px 8px rgb(0 0 0 / 3 0%);
    /* 入场/退场动画（@starting-style + allow-discrete，见 animate-element-entry-exit 指南） */
    opacity:1; transform:translateY(0) scale(1); transform-origin:top right;
    transition:opacity .16s var(--ease), transform .16s var(--ease), display .16s allow-discrete;
  }
  @starting-style { .msel-menu { opacity:0; transform:translateY(6px) scale(.97); } }
  .msel-menu[hidden] { display:none; opacity:0; transform:translateY(6px) scale(.97); }
  .msel-head { color:var(--dim); font-size:11px; padding:7px 10px 5px; letter-spacing:.4px; }
  .msel-item {
    display:flex; align-items:center; gap:9px; width:100%; padding:8px 10px;
    background:none; border:none; border-radius:8px; color:var(--text);
    font-size:13px; text-align:left; cursor:pointer; height:auto;
    transition:background-color .12s;
  }
  .msel-item:hover, .msel-item:focus-visible { background:var(--surface-hover); }
  .msel-item .ck { color:var(--accent); width:14px; flex:none; display:inline-flex; }
  .msel-item .ck svg { width:13px; height:13px; }
  .msel-item .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .msel-item .tg { color:var(--dim); font-size:10.5px; flex:none; }
  .msel-item[aria-current="true"] { background:var(--accent-soft); }
  .msel-item[aria-current="true"] .nm { color:var(--accent); }
  .msel-status { color:var(--dim); font-size:12px; padding:10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .msel-status.err { color:#ff9a9a; }
  .msel-status svg { width:14px; height:14px; flex:none; }
  .msel-retry {
    background:var(--surface-hover); border:1px solid var(--line); color:var(--text);
    height:24px; padding:0 10px; border-radius:6px; font-size:12px; cursor:pointer;
  }
  .msel-retry:hover { border-color:#39415a; }

  /* ---------- 对话区 ---------- */
  #chat { flex:1; overflow-y:auto; padding:26px 22px; scroll-behavior:smooth; }
  .wrap { max-width:820px; margin:0 auto; }
  .msg { margin-bottom:24px; display:flex; gap:12px; animation:msg-in .38s var(--ease) both; }
  @keyframes msg-in { from { opacity:0; transform:translateY(12px); } }
  .avatar {
    width:32px; height:32px; border-radius:9px; flex:none;
    display:flex; align-items:center; justify-content:center;
    background:var(--surface); border:1px solid var(--line); color:var(--dim);
  }
  .avatar svg { width:17px; height:17px; }
  .avatar img { width:22px; height:22px; border-radius:5px; display:block; }
  .bubble { flex:1; min-width:0; }
  .who { font-size:12px; color:var(--dim); margin-bottom:5px; }
  .content { word-break:break-word; }
  .content p { margin:0 0 8px; }
  .content p:last-child { margin-bottom:0; }
  .content pre { background:#0a0c10; border:1px solid var(--line); border-radius:10px; padding:12px 14px; overflow-x:auto; margin:8px 0; }
  .content code { font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .content p code, .content li code { background:#0a0c10; border:1px solid var(--line); border-radius:5px; padding:1px 5px; color:var(--accent); }
  .think {
    border-left:3px solid var(--think); background:rgb(94 200 216 / 6%);
    border-radius:0 10px 10px 0; padding:9px 13px; margin:0 0 10px;
    color:var(--think); font-size:13.5px; white-space:pre-wrap;
  }
  .think summary {
    cursor:pointer; color:var(--think); font-size:12.5px; user-select:none; outline:none;
    display:flex; align-items:center; gap:6px; list-style:none;
  }
  .think summary::-webkit-details-marker { display:none; }
  .think summary svg { width:13px; height:13px; flex:none; transition:transform .2s var(--ease); }
  .think[open] summary svg { transform:rotate(12deg); }
  .think[open] summary { margin-bottom:7px; }
  .think .t { animation:fade-in .25s var(--ease) both; }
  @keyframes fade-in { from { opacity:0; } }
  .live { color:var(--dim); font-size:12.5px; margin-top:7px; display:flex; align-items:center; gap:9px; font-variant-numeric:tabular-nums; min-height:20px; }
  .dots { display:inline-flex; gap:4px; flex:none; }
  .dots i { width:6px; height:6px; border-radius:50%; background:var(--accent); animation:blink 1.2s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay:.18s; }
  .dots i:nth-child(3) { animation-delay:.36s; }
  @keyframes blink { 0%,60%,100% { opacity:.25; transform:translateY(0); } 30% { opacity:1; transform:translateY(-3px); } }
  .usage { color:var(--dim); font-size:12px; margin-top:7px; font-variant-numeric:tabular-nums; animation:fade-in .3s var(--ease) both; }
  .err {
    color:#ff9a9a; background:var(--danger-bg); border:1px solid rgb(255 107 107 / 30%);
    border-radius:10px; padding:10px 13px; animation:msg-in .3s var(--ease) both;
  }
  .nokey {
    max-width:820px; margin:26px auto; border:1px solid var(--accent-line);
    background:var(--accent-soft); border-radius:12px; padding:16px 18px;
    animation:msg-in .4s var(--ease) both;
  }
  .nokey code { color:var(--accent); background:#0a0c10; border:1px solid var(--line); border-radius:5px; padding:1px 6px; }
  body.dragover::after {
    content:"松开鼠标，发送图片"; position:fixed; inset:14px; z-index:100;
    background:rgb(255 209 0 / 8%); border:2px dashed var(--accent); border-radius:18px;
    display:flex; align-items:center; justify-content:center;
    color:var(--accent); font-size:17px; letter-spacing:1px; pointer-events:none;
    animation:fade-in .2s var(--ease) both;
  }

  /* ---------- 输入区 ---------- */
  footer {
    border-top:1px solid var(--line); padding:14px 22px 16px; flex:none;
    background:rgb(21 24 32 / 82%); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    animation:rise-in .5s .06s var(--ease) both;
  }
  @keyframes rise-in { from { opacity:0; transform:translateY(12px); } }
  .composer {
    max-width:820px; margin:0 auto; display:flex; gap:10px; align-items:flex-end;
    background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:9px 10px;
    transition:border-color .2s, box-shadow .2s;
  }
  .composer:focus-within { border-color:var(--accent-line); box-shadow:0 0 0 3px var(--accent-soft); }
  .composer .iconbtn { background:transparent; border-color:transparent; }
  .composer .iconbtn:hover { background:var(--surface-hover); border-color:var(--line); }
  #imgBtn { position:relative; overflow:hidden; }
  #imgBtn input[type=file] { position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; }
  textarea {
    flex:1; resize:none; background:transparent; color:var(--text);
    border:none; padding:9px 4px; font:inherit; max-height:160px; outline:none;
  }
  textarea::placeholder { color:var(--dim); }
  #send {
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:11px;
    height:42px; padding:0 17px; font-size:14px; font-weight:600; cursor:pointer;
    display:inline-flex; align-items:center; gap:7px; flex:none;
    transition:background-color .15s, box-shadow .2s, transform .12s var(--ease);
  }
  #send svg { width:16px; height:16px; }
  #send:hover { background:#ffe14d; box-shadow:0 4px 18px rgb(255 209 0 / 30%); }
  #send:active { transform:scale(.95); }
  #send:disabled { opacity:.45; cursor:not-allowed; box-shadow:none; }
  #stopBtn {
    background:var(--danger-bg); color:var(--danger); border:1px solid rgb(255 107 107 / 35%);
    border-radius:11px; height:42px; padding:0 16px; font-size:14px; cursor:pointer;
    display:inline-flex; align-items:center; gap:7px; flex:none;
    animation:pulse 1.7s ease-in-out infinite;
    transition:background-color .15s, transform .12s var(--ease);
  }
  #stopBtn svg { width:12px; height:12px; }
  #stopBtn:hover { background:rgb(255 107 107 / 22%); }
  #stopBtn:active { transform:scale(.95); }
  @keyframes pulse {
    0%,100% { box-shadow:0 0 0 0 rgb(255 107 107 / 32%); }
    50% { box-shadow:0 0 0 7px rgb(255 107 107 / 0%); }
  }
  #stopBtnTop { animation:pulse 1.7s ease-in-out infinite; }
  #imgPreview { max-width:820px; margin:0 auto 10px; }
  #imgPreview .card {
    display:inline-flex; align-items:center; gap:10px; background:var(--bg);
    border:1px solid var(--line); border-radius:10px; padding:7px 10px;
    animation:msg-in .25s var(--ease) both;
  }
  #imgPreview img { height:52px; border-radius:6px; display:block; }
  #imgPreview .nm { color:var(--dim); font-size:13px; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #imgPreview .rm { cursor:pointer; color:var(--dim); display:inline-flex; padding:4px; border-radius:6px; transition:color .15s, background-color .15s; }
  #imgPreview .rm svg { width:13px; height:13px; }
  #imgPreview .rm:hover { color:var(--danger); background:var(--danger-bg); }
  .content img.userimg { max-width:260px; max-height:200px; border-radius:10px; display:block; margin-top:4px; border:1px solid var(--line); }
  .hint { max-width:820px; margin:9px auto 0; color:var(--dim); font-size:11.5px; text-align:center; }

  /* ---------- 设置弹层（原生 dialog + top-layer 动画，见 animate-to-from-top-layer 指南） ---------- */
  dialog#settingsDlg {
    position:fixed; inset:0; margin:auto; width:min(560px, calc(100vw - 32px)); height:fit-content;
    background:var(--panel); border:1px solid #333b52; border-radius:18px; padding:0;
    box-shadow:0 24px 80px rgb(0 0 0 / 55%);
    opacity:1; transform:scale(1);
    transition:opacity .26s var(--ease), transform .26s var(--ease), display .26s allow-discrete, overlay .26s allow-discrete;
  }
  @starting-style { dialog#settingsDlg[open] { opacity:0; transform:scale(.92) translateY(10px); } }
  dialog#settingsDlg:not([open]) { opacity:0; transform:scale(.92) translateY(10px); }
  dialog#settingsDlg::backdrop {
    background:rgb(6 8 12 / 0%); backdrop-filter:blur(0px); -webkit-backdrop-filter:blur(0px);
    transition:background-color .26s, backdrop-filter .26s, display .26s allow-discrete, overlay .26s allow-discrete;
  }
  dialog#settingsDlg[open]::backdrop { background:rgb(6 8 12 / 58%); backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px); }
  @starting-style { dialog#settingsDlg[open]::backdrop { background:rgb(6 8 12 / 0%); } }
  .dlg-head { display:flex; align-items:center; padding:16px 18px 12px; border-bottom:1px solid var(--line); }
  .dlg-head h2 { font-size:15px; font-weight:650; flex:1; }
  .dlg-sec { padding:14px 18px; border-bottom:1px solid var(--line); }
  .dlg-sec:last-child { border-bottom:none; }
  .dlg-sec-title { color:var(--dim); font-size:11px; letter-spacing:.6px; margin-bottom:8px; }
  .set-row { display:flex; align-items:center; gap:14px; padding:7px 0; }
  .set-info { flex:1; min-width:0; }
  .set-title { font-size:13.5px; }
  .set-desc { color:var(--dim); font-size:11.5px; margin-top:2px; }
  .set-val { color:var(--dim); font-size:12px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; max-width:60%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .set-status { color:var(--dim); font-size:11.5px; margin-top:6px; min-height:16px; display:flex; align-items:center; gap:6px; }
  .set-status.ok { color:#7be0a8; }
  .set-status.busy { color:var(--accent); }
  .set-status .dots i { background:currentColor; }

  /* ---------- 滚动条 ---------- */
  #chat::-webkit-scrollbar, .msel-menu::-webkit-scrollbar { width:9px; }
  #chat::-webkit-scrollbar-thumb, .msel-menu::-webkit-scrollbar-thumb { background:#2c3346; border-radius:99px; border:2px solid var(--bg); }
  #chat::-webkit-scrollbar-thumb:hover { background:#3a4258; }
  #chat::-webkit-scrollbar-track { background:transparent; }

  /* ---------- 动效可达性：尊重系统减少动态偏好 ---------- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration:.01ms !important; animation-iteration-count:1 !important;
      transition-duration:.01ms !important; scroll-behavior:auto !important;
    }
    .aurora::before { animation:none; }
  }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"></div>

<header>
  <div class="brand">
    <img class="brand-mark" src="/icon.svg" alt="" width="32" height="32">
    <div class="brand-text">
      <h1>ModelTester</h1>
      <span class="brand-sub">全球新模型速测工作台</span>
    </div>
  </div>
  <div class="meta">
    <label class="switch" title="展示模型的思考过程">
      <input type="checkbox" id="thinkToggle" checked>
      <span class="track"><span class="knob"></span></span>
      <span class="switch-text">思考过程</span>
    </label>
    <button id="stopBtnTop" class="iconbtn danger" title="停止生成" hidden aria-label="停止生成"></button>
    <button id="settingsBtn" class="iconbtn" title="设置" aria-label="设置" aria-haspopup="dialog"></button>
    <div class="msel" id="modelSel">
      <button id="modelTrigger" class="msel-trigger" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="modelMenu" title="选择模型">
        <span class="msel-ico" id="modelVendor"></span>
        <span class="msel-label" id="modelLabel">选择模型</span>
        <span class="msel-tag" id="modelTag" hidden></span>
        <span class="msel-chev"></span>
      </button>
      <div class="msel-menu" id="modelMenu" role="menu" aria-label="选择模型" hidden></div>
    </div>
  </div>
</header>

<main id="chat"><div class="wrap" id="list"><div class="nokey" id="nokey" hidden></div></div></main>

<footer>
  <div id="imgPreview" hidden></div>
  <div class="composer">
    <label id="imgBtn" class="iconbtn lg" title="发送图片：点击选择，也可粘贴或拖拽；或输入 /img 图片路径"><input type="file" id="fileInput" accept="image/*"></label>
    <textarea id="input" rows="1" placeholder="给当前模型发送消息…  Enter 发送，Shift+Enter 换行；可粘贴 / 拖拽图片，或 /img 图片路径"></textarea>
    <button id="stopBtn" title="停止生成" hidden></button>
    <button id="send"></button>
  </div>
  <div class="hint">模型由美团 LongCat API 提供 · api.longcat.chat · 限时价 输入 ¥2 / 输出 ¥8 每百万 tokens · 生成中输入 /stop 停止 · 输入 /model 切换模型</div>
  <div class="hint" id="pvHint" hidden></div>
</footer>

<dialog id="settingsDlg" closedby="any" aria-labelledby="dlgTitle">
  <div class="dlg-head">
    <h2 id="dlgTitle">设置</h2>
    <button class="iconbtn" id="dlgClose" aria-label="关闭"></button>
  </div>
  <section class="dlg-sec">
    <div class="dlg-sec-title">服务</div>
    <div class="set-row">
      <div class="set-info">
        <div class="set-title">开机自启</div>
        <div class="set-desc">登录 macOS 时自动启动 ModelTester 服务</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="autostartToggle">
        <span class="track"><span class="knob"></span></span>
      </label>
    </div>

<script type="module">
import { SseParser } from '/util/sse.mjs';
import { mountProviders } from '/providers.mjs';

// ---------- 图标（内联 SVG，替代全部 emoji） ----------
const I = (paths, extra) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"' + (extra || '') + '>' + paths + '</svg>';
const SVG = {
  spark: I('<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>'),
  chev: I('<polyline points="6 9 12 15 18 9"/>'),
  check: I('<polyline points="4.5 12.5 9.5 17.5 19.5 6.5"/>'),
  alert: I('<path d="M12 3.5l9.2 16.5H2.8z"/><line x1="12" y1="10" x2="12" y2="14"/><circle cx="12" cy="17" r=".5" fill="currentColor"/>'),
  gear: I('<line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2.2" fill="currentColor" stroke="none"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2.2" fill="currentColor" stroke="none"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="7" cy="18" r="2.2" fill="currentColor" stroke="none"/>'),
  clip: I('<path d="M21.4 11.05l-8.49 8.49a5.5 5.5 0 0 1-7.78-7.78l8.49-8.49a3.5 3.5 0 0 1 4.95 4.95l-8.49 8.49a1.5 1.5 0 0 1-2.12-2.12l7.78-7.78"/>'),
  up: I('<line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>'),
  square: I('<rect x="7" y="7" width="10" height="10" rx="2.2" fill="currentColor" stroke="none"/>'),
  x: I('<line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>'),
  bulb: I('<path d="M9.5 18h5M10.5 21h3M12 3a6 6 0 0 1 3.6 10.8c-.8.5-1.1 1.2-1.1 2.2h-5c0-1-.3-1.7-1.1-2.2A6 6 0 0 1 12 3z"/>'),
  person: I('<circle cx="12" cy="8" r="3.8"/><path d="M4.5 20.5c0-3.8 3.4-6 7.5-6s7.5 2.2 7.5 6"/>'),
  dots: '<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>',
};
const $ = (id) => document.getElementById(id);

// ---------- 元素 ----------
var list = $('list'), input = $('input'), sendBtn = $('send'), stopBtn = $('stopBtn'),
    stopBtnTop = $('stopBtnTop'), chatBox = $('chat'), thinkToggle = $('thinkToggle'),
    modelSel = $('modelSel'), modelTrigger = $('modelTrigger'), modelMenu = $('modelMenu'),
    modelLabel = $('modelLabel'), modelTagEl = $('modelTag'), modelVendor = $('modelVendor'),
    settingsBtn = $('settingsBtn'), dlg = $('settingsDlg'), dlgClose = $('dlgClose'),
    autostartToggle = $('autostartToggle'), svcStatus = $('svcStatus'),
    dataDirPath = $('dataDirPath'), portVal = $('portVal'), verVal = $('verVal'),
    fileInput = $('fileInput'), imgPreview = $('imgPreview');

// 静态图标注入
$('settingsBtn').innerHTML = SVG.gear;
dlgClose.innerHTML = SVG.x;
stopBtnTop.innerHTML = SVG.square;
stopBtn.innerHTML = SVG.square + '<span>停止</span>';
sendBtn.innerHTML = SVG.up + '<span>发送</span>';
$('imgBtn').insertAdjacentHTML('afterbegin', SVG.clip);
document.querySelector('.msel-chev').innerHTML = SVG.chev;

// ---------- 状态 ----------
var chatHistory = [];
var sending = false;
var stopped = false; // 模块级声明：strict mode 下 stopGeneration 需可访问
var pendingImage = null;
var abortCtrl = null;
var currentRequestId = null;
var modelState = { status: 'idle', models: [], providers: [], error: null };
var currentModel = '';
try { currentModel = localStorage.getItem('modeltester.model') || ''; } catch (e) {}
var modelsInflight = null;

// ---------- 工具 ----------
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function md(src) {
  var parts = src.split(/```/);
  var out = '';
  for (var i = 0; i < parts.length; i++) {
    if (i % 2 === 1) {
      var code = parts[i].replace(/^[a-zA-Z0-9+#-]*\n/, '');
      out += '<pre><code>' + esc(code) + '</code></pre>';
    } else {
      var t = esc(parts[i]);
      t = t.replace(/`([^`\n]+)`/g, '<code>$1</code>');
      t = t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
      t = t.split(/\n{2,}/).map(function (p) {
        return p.charAt(0) === '\n' ? '<p>' + p.slice(1) + '</p>' : '<p>' + p + '</p>';
      }).join('');
      out += t;
    }
  }
  return out;
}

// ---------- 启动状态 ----------
fetch('/api/status').then(function (r) { return r.json(); }).then(function (s) {
  if (!s.hasKey) {
    var d = $('nokey');
    d.hidden = false;
    d.innerHTML = '<b>还没有 API Key</b><br>1. 打开 <code>https://longcat.chat/platform/api_keys</code> 注册登录并创建 Key<br>'
      + '2. 启动服务时设置环境变量 <code>MODELTESTER_API_KEY</code>，或把 Key 写进数据目录下的 <code>modeltester.config.json</code> 的 <code>apiKey</code> 字段<br>3. 刷新本页';
  }
  if (!currentModel && s.model) currentModel = s.model;
  renderTrigger();
  loadModels(false).then(renderTrigger);
});

// ---------- 模型选择器（触发器 + 弹层 + 键盘导航 + 焦点归还 + 外部点击关闭） ----------
function loadModels(force) {
  if (modelsInflight) return modelsInflight;
  // async IIFE + try/catch：任何同步/异步异常都落到 error 态，避免重试按钮点不动
  modelsInflight = (async function () {
    try {
      const r = await fetch('/api/models' + (force ? '?force=1' : ''));
      const j = await r.json();
      modelState.status = j.ok ? 'ready' : 'error';
      modelState.models = Array.isArray(j.models) ? j.models : [];
      modelState.error = j.error || null;
      modelState.providers = Array.isArray(j.providers) ? j.providers : [];
      if (!currentModel && j.default) currentModel = j.default;
    } catch (e) {
      modelState.status = 'error';
      modelState.error = (e && e.message) ? e.message : String(e);
    }
    return modelState;
  })().finally(function () { modelsInflight = null; });
  return modelsInflight;
}

function modelById(id) {
  for (var i = 0; i < modelState.models.length; i++) if (modelState.models[i].id === id) return modelState.models[i];
  return null;
}

// 提供方目录（/api/models 随模型一起返回）：模型选择器按提供方分组，发送时按模型反查提供方
function providerById(id) {
  for (var i = 0; i < modelState.providers.length; i++) if (modelState.providers[i].id === id) return modelState.providers[i];
  return null;
}
function providerForModel(id) {
  var m = modelById(id);
  return m ? providerById(m.provider) : null;
}
function currentProviderId() {
  var p = providerForModel(currentModel);
  return p ? p.id : '';
}

// 当前接入厂商的标识：按模型 ID 前缀匹配，接入新厂商时在 public/vendors/ 放图标并在此追加一行
var VENDOR_MARKS = [{ match: 'LongCat', icon: '/vendor/meituan.svg' }];
function vendorMarkFor(id) {
  for (var i = 0; i < VENDOR_MARKS.length; i++) if (id.indexOf(VENDOR_MARKS[i].match) === 0) return VENDOR_MARKS[i].icon;
  return '';
}

function renderTrigger() {
  var m = modelById(currentModel);
  modelLabel.textContent = m ? m.name : (currentModel || '选择模型');
  modelTrigger.title = m ? m.id : '选择模型';
  if (m && m.tag) { modelTagEl.textContent = m.tag; modelTagEl.hidden = false; }
  else { modelTagEl.textContent = ''; modelTagEl.hidden = true; }
  var mark = vendorMarkFor(currentModel);
  modelVendor.innerHTML = mark ? '<img src="' + mark + '" alt="">' : SVG.spark;
  renderProviderHint();
}

// 当前提供方提示：自定义提供方时说明价格按该厂商计，避免误读内置的限时价
function renderProviderHint() {
  var p = providerForModel(currentModel);
  var box = $('pvHint');
  if (!box) return;
  if (!p || p.builtin) { box.hidden = true; box.textContent = ''; return; }
  box.hidden = false;
  box.textContent = '当前提供方：' + p.name + ' · ' + p.baseUrl
    + (p.price ? ' · 输入 ¥' + p.price.input + ' / 输出 ¥' + p.price.output + ' 每百万 tokens' : ' · 未设置单价，账本按内置价格估算');
}

// 按提供方分组的模型列表（内置在前，自定义提供方按加入顺序）
function groupsHtml() {
  var order = [], byProvider = {};
  for (var i = 0; i < modelState.models.length; i++) {
    var m = modelState.models[i];
    var pid = m.provider || '';
    if (!byProvider[pid]) { byProvider[pid] = []; order.push(pid); }
    byProvider[pid].push(m);
  }
  var html = '';
  for (var g = 0; g < order.length; g++) {
    var pid = order[g];
    var p = providerById(pid);
    html += '<div class="msel-head">' + esc(p ? p.name : pid) + '</div>';
    var list = byProvider[pid];
    for (var j = 0; j < list.length; j++) {
      var m = list[j];
      var cur = m.id === currentModel;
      html += '<button type="button" role="menuitem" class="msel-item" data-model="' + esc(m.id) + '"' + (cur ? ' aria-current="true"' : '') + '>'
        + '<span class="ck">' + (cur ? SVG.check : '') + '</span>'
        + '<span class="nm">' + esc(m.name) + '</span>'
        + (m.tag ? '<span class="tg">' + esc(m.tag) + '</span>' : '')
        + (m.owned ? '<span class="tg">默认</span>' : '')
        + '</button>';
    }
  }
  return html;
}

function renderMenu() {
  var html = '';
  if (modelState.status === 'loading') {
    html = '<div class="msel-status">' + SVG.dots + '正在加载模型列表…</div>';
  } else if (modelState.status === 'error') {
    html = '<div class="msel-status err">' + SVG.alert + '<span>' + esc(modelState.error || '加载失败') + '</span><button type="button" class="msel-retry" id="modelRetry">重试</button></div>';
    // 内置目录失败时自定义提供方的模型在本地，仍要能选
    html += groupsHtml();
  } else if (!modelState.models.length) {
    html = '<div class="msel-status">暂未获取到可用模型</div>';
  } else {
    html = groupsHtml();
  }
  modelMenu.innerHTML = html;
  var retry = $('modelRetry');
  if (retry) retry.onclick = function (ev) { ev.stopPropagation(); refreshMenu(); };
  var items = modelMenu.querySelectorAll('.msel-item');
  for (var k = 0; k < items.length; k++) {
    items[k].onclick = function () { selectModel(this.getAttribute('data-model')); };
  }
}

function focusItem(idx) {
  var items = modelMenu.querySelectorAll('.msel-item');
  if (!items.length) return;
  var i = ((idx % items.length) + items.length) % items.length;
  items[i].focus();
}

function moveFocus(offset) {
  var items = modelMenu.querySelectorAll('.msel-item');
  if (!items.length) return;
  var active = -1;
  for (var i = 0; i < items.length; i++) if (items[i] === document.activeElement) active = i;
  focusItem((active < 0 ? 0 : active) + offset);
}

// 弹层定位：贴触发器右对齐、优先向上弹出；上方空间不足（触发器在页头）则向下展开，并钳制在视口内
function placeMenu() {
  if (modelMenu.hidden) return;
  var rect = modelTrigger.getBoundingClientRect();
  var MARGIN = 12;
  var mw = modelMenu.offsetWidth;
  var mh = modelMenu.offsetHeight;
  var x = rect.right - mw;
  var y = rect.top - 8 - mh;
  if (mh > 0 && y < MARGIN) y = rect.bottom + 8;
  if (mw > 0) x = Math.min(Math.max(x, MARGIN), Math.max(MARGIN, window.innerWidth - mw - MARGIN));
  if (mh > 0) y = Math.min(Math.max(y, MARGIN), Math.max(MARGIN, window.innerHeight - mh - MARGIN));
  modelMenu.style.left = x + 'px';
  modelMenu.style.top = y + 'px';
}

function watchPlace(on) {
  if (on) {
    window.addEventListener('scroll', placeMenu, true);
    window.addEventListener('resize', placeMenu);
  } else {
    window.removeEventListener('scroll', placeMenu, true);
    window.removeEventListener('resize', placeMenu);
  }
}

function openMenu() {
  if (!modelMenu.hidden) { closeMenu(); return; }
  modelMenu.hidden = false;
  modelTrigger.setAttribute('aria-expanded', 'true');
  modelMenu.setAttribute('aria-busy', 'true');
  renderMenu();
  placeMenu();
  watchPlace(true);
  loadModels(false).then(function () {
    if (modelMenu.hidden) return;
    modelMenu.setAttribute('aria-busy', 'false');
    renderMenu();
    placeMenu();
    focusItem(0);
  });
}

function closeMenu(restoreFocus) {
  if (modelMenu.hidden) return;
  modelMenu.hidden = true;
  modelTrigger.setAttribute('aria-expanded', 'false');
  modelMenu.setAttribute('aria-busy', 'false');
  watchPlace(false);
  if (restoreFocus) modelTrigger.focus();
}

function refreshMenu() {
  modelState.status = 'loading';
  renderMenu();
  loadModels(true).then(function () {
    renderMenu();
    placeMenu();
    focusItem(0);
  });
}

function selectModel(id) {
  if (!id) return;
  if (id === currentModel) { closeMenu(true); return; }
  currentModel = id;
  try { localStorage.setItem('modeltester.model', id); } catch (e) {}
  renderTrigger();
  closeMenu(true);
}

modelTrigger.onclick = function () { openMenu(); };

// Escape 优先关闭弹层（并阻止冒泡，避免触发停止生成）；↑/↓ 循环移动焦点
modelSel.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && !modelMenu.hidden) {
    e.preventDefault();
    e.stopPropagation();
    closeMenu(true);
    return;
  }
  if (!modelMenu.hidden && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    e.preventDefault();
    moveFocus(e.key === 'ArrowDown' ? 1 : -1);
  }
});

// 点击弹层外部关闭
document.addEventListener('mousedown', function (e) {
  if (!modelMenu.hidden && !modelSel.contains(e.target)) closeMenu(false);
});

// 焦点离开选择器时关闭
modelSel.addEventListener('focusout', function (e) {
  if (modelMenu.hidden) return;
  var to = e.relatedTarget;
  if (to && (modelSel.contains(to) || modelMenu.contains(to))) return;
  closeMenu(false);
});

// ---------- 滚动 ----------
function nearBottom() { return chatBox.scrollHeight - chatBox.scrollTop - chatBox.clientHeight < 140; }
function maybeScroll() { if (nearBottom()) chatBox.scrollTop = chatBox.scrollHeight; }

// ---------- 消息 ----------
function addMsg(role, who, imgUrl) {
  var div = document.createElement('div');
  div.className = 'msg ' + role;
  var avatar = role === 'user' ? SVG.person : '<img src="/vendor/meituan.svg" alt="">';
  div.innerHTML = '<div class="avatar">' + avatar + '</div><div class="bubble"><div class="who">' + who + '</div><div class="content"></div></div>';
  list.appendChild(div);
  var content = div.querySelector('.content');
  if (imgUrl) {
    var im = document.createElement('img');
    im.src = imgUrl; im.className = 'userimg';
    content.appendChild(im);
  }
  maybeScroll();
  return content;
}

// ---------- 图片 ----------
function showPreview() {
  imgPreview.hidden = false;
  imgPreview.innerHTML = '';
  var card = document.createElement('div');
  card.className = 'card';
  var im = document.createElement('img');
  im.src = pendingImage.dataUrl;
  var name = document.createElement('span');
  name.className = 'nm';
  name.textContent = pendingImage.name;
  var rm = document.createElement('span');
  rm.className = 'rm';
  rm.title = '移除图片';
  rm.innerHTML = SVG.x;
  rm.onclick = clearImage;
  card.appendChild(im); card.appendChild(name); card.appendChild(rm);
  imgPreview.appendChild(card);
}
function clearImage() {
  pendingImage = null;
  imgPreview.hidden = true;
  imgPreview.innerHTML = '';
  fileInput.value = '';
}
function readImage(file) {
  if (!file || !file.type || file.type.indexOf('image/') !== 0) return;
  if (file.size > 10 * 1024 * 1024) { alert('图片不能超过 10MB'); return; }
  var reader = new FileReader();
  reader.onload = function () {
    pendingImage = { dataUrl: reader.result, name: file.name || '粘贴的图片' };
    showPreview();
  };
  reader.readAsDataURL(file);
}

// ---------- 发送 ----------
async function send() {
  var text = input.value.trim();
  if (!text || sending) return;
  sending = true;
  sendBtn.hidden = true;
  stopBtn.hidden = false;
  stopBtnTop.hidden = false;
  input.value = ''; input.style.height = 'auto';

  var imagePath = null, imageText = null;
  if (text === '/img' || text.indexOf('/img ') === 0) {
    var rest = text.slice(4).trim();
    if (rest.charAt(0) === '"') {
      var endq = rest.indexOf('"', 1);
      if (endq > 0) { imagePath = rest.slice(1, endq); imageText = rest.slice(endq + 1).trim(); }
    }
    if (!imagePath) {
      var sp = rest.indexOf(' ');
      if (sp >= 0) { imagePath = rest.slice(0, sp); imageText = rest.slice(sp + 1).trim(); }
      else { imagePath = rest; }
    }
    if (!imageText) imageText = '请描述这张图片';
    text = imagePath + (imageText !== '请描述这张图片' ? ' — ' + imageText : '');
  }

  if (pendingImage) {
    var imgUrl = pendingImage.dataUrl;
    addMsg('user', '你', imgUrl).appendChild(document.createTextNode(text));
    chatHistory.push({ role: 'user', content: [{ type: 'image_url', image_url: { url: imgUrl } }, { type: 'text', text: text }] });
    clearImage();
  } else {
    addMsg('user', '你').textContent = text;
    chatHistory.push({ role: 'user', content: text });
  }

  var body = addMsg('assistant', (modelById(currentModel) || {}).name || 'ModelTester');
  var thinkBox = null, answer = '';
  var liveLine = document.createElement('div');
  liveLine.className = 'live';
  liveLine.innerHTML = SVG.dots + '<span class="lt"></span>';
  body.appendChild(liveLine);
  var liveText = liveLine.querySelector('.lt');
  var started = Date.now();
  stopped = false;
  var timer = setInterval(function () {
    var secs = ((Date.now() - started) / 1000).toFixed(1);
    liveText.textContent = (answer ? '生成中 ' + secs + 's · ' + answer.length + ' 字' : '思考中 ' + secs + 's');
    maybeScroll();
  }, 120);

  try {
    abortCtrl = new AbortController();
    currentRequestId = (self.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'r' + Date.now().toString(16) + Math.random().toString(16).slice(2);
    var resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: chatHistory, thinking: thinkToggle.checked, imagePath: imagePath, imageText: imageText, requestId: currentRequestId, model: currentModel, provider: currentProviderId() }),
      signal: abortCtrl.signal,
    });
    if (!resp.ok) {
      var e = await resp.text();
      liveLine.remove();
      body.innerHTML = '<div class="err">' + esc(e) + '</div>';
      chatHistory.pop();
    } else {
      var reader = resp.body.getReader();
      var decoder = new TextDecoder();
      var parser = new SseParser();
      // SseParser 内部保留残尾，按 chunk 直接喂入；流结束后 flush 最后半个无空行结尾的事件
      var handle = function (events) {
        for (var ev of events) {
          if (ev.data === '[DONE]') continue;
          var j;
          try { j = JSON.parse(ev.data); } catch (err) { continue; }
          var d = j.choices && j.choices[0] && j.choices[0].delta;
          if (!d) continue;
          if (d.reasoning_content) {
            if (!thinkBox) {
              thinkBox = document.createElement('details');
              thinkBox.className = 'think';
              thinkBox.innerHTML = '<summary>' + SVG.bulb + '思考过程</summary><div class="t"></div>';
              body.prepend(thinkBox);
            }
            thinkBox.querySelector('.t').textContent += d.reasoning_content;
          }
          if (d.content) {
            answer += d.content;
            var holder = body.querySelector('.a') || (function () {
              var h = document.createElement('div'); h.className = 'a'; body.appendChild(h); return h;
            })();
            holder.innerHTML = md(answer);
          }
          maybeScroll();
        }
      };
      for (;;) {
        var chunk = await reader.read();
        if (chunk.done) break;
        handle(parser.feed(decoder.decode(chunk.value, { stream: true })));
      }
      handle(parser.end());
      liveLine.remove();
      var holder2 = body.querySelector('.a');
      if (holder2) holder2.innerHTML = md(answer);
      var secs2 = ((Date.now() - started) / 1000).toFixed(1);
      var u = document.createElement('div');
      u.className = 'usage';
      u.textContent = secs2 + 's · ' + answer.length + ' 字' + (stopped ? ' · 已停止' : '');
      body.appendChild(u);
      chatHistory.push({ role: 'assistant', content: answer });
    }
  } catch (err) {
    liveLine.remove();
    if (err && err.name === 'AbortError') {
      var holder3 = body.querySelector('.a');
      if (holder3 && answer) {
        var u2 = document.createElement('div');
        u2.className = 'usage';
        u2.textContent = '已停止 · 保留 ' + answer.length + ' 字';
        body.appendChild(u2);
        chatHistory.push({ role: 'assistant', content: answer });
      } else {
        body.innerHTML = '<div class="usage">已停止，未产生内容</div>';
        chatHistory.pop();
      }
    } else {
      body.innerHTML = '<div class="err">' + esc(String(err)) + '</div>';
      chatHistory.pop();
    }
  } finally {
    clearInterval(timer);
    sending = false;
    sendBtn.hidden = false;
    stopBtn.hidden = true;
    stopBtnTop.hidden = true;
    abortCtrl = null;
    currentRequestId = null;
    input.focus();
  }
}

// ---------- 停止（页脚 / 顶栏 / /stop / Escape 四通道） ----------
function mkAbortErr() {
  try { return new DOMException('Aborted', 'AbortError'); }
  catch (e) { var err = new Error('Aborted'); err.name = 'AbortError'; return err; }
}

function stopGeneration() {
  stopped = true;
  try {
    fetch('/api/abort', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ requestId: currentRequestId }), keepalive: true }).catch(function () { });
  } catch (e) { }
  if (abortCtrl) abortCtrl.abort();
}
stopBtn.onclick = stopGeneration;
stopBtnTop.onclick = stopGeneration;
stopBtn.addEventListener('pointerdown', function () { if (sending) stopGeneration(); });
stopBtnTop.addEventListener('pointerdown', function () { if (sending) stopGeneration(); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && abortCtrl && dlg.open === false) stopGeneration();
});

// ---------- 输入交互 ----------
sendBtn.onclick = send;
input.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (input.value.trim() === '/stop') {
      input.value = ''; input.style.height = 'auto';
      if (sending) stopGeneration();
      return;
    }
    if (input.value.trim() === '/model') {
      input.value = ''; input.style.height = 'auto';
      openMenu();
      return;
    }
    send();
  }
});
input.addEventListener('input', function () {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
});
input.addEventListener('paste', function (e) {
  var items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (var i = 0; i < items.length; i++) {
    if (items[i].type && items[i].type.indexOf('image/') === 0) { readImage(items[i].getAsFile()); e.preventDefault(); return; }
  }
});
document.addEventListener('paste', function (e) {
  var items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (var i = 0; i < items.length; i++) {
    if (items[i].type && items[i].type.indexOf('image/') === 0) { readImage(items[i].getAsFile()); input.focus(); return; }
  }
});
['dragenter', 'dragover'].forEach(function (ev) {
  document.addEventListener(ev, function (e) { e.preventDefault(); document.body.classList.add('dragover'); });
});
['dragleave', 'drop'].forEach(function (ev) {
  document.addEventListener(ev, function (e) { e.preventDefault(); if (ev === 'drop' || e.target === document.documentElement) document.body.classList.remove('dragover'); });
});
document.addEventListener('drop', function (e) {
  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) readImage(e.dataTransfer.files[0]);
});

// ---------- 设置弹层 ----------
settingsBtn.onclick = function () { dlg.showModal(); loadSettings(); };
dlgClose.onclick = function () { dlg.close(); };
// closedby 特性检测：不支持时用点击 backdrop 关闭兜底
if (!('closedBy' in HTMLElement.prototype)) {
  dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
}

var settingsBusy = false;

function renderSvcStatus(j, busyText) {
  svcStatus.className = 'set-status' + (busyText ? ' busy' : (j && j.autostart ? ' ok' : ''));
  if (busyText) { svcStatus.innerHTML = SVG.dots + busyText; return; }
  if (!j) { svcStatus.textContent = '设置读取失败'; return; }
  // 能收到响应即证明 App 正在运行；job 状态只影响开机行为
  if (!j.autostart) svcStatus.textContent = '服务运行中 · 开机不会自动启动';
  else svcStatus.textContent = j.managed ? '服务运行中 · 开机自启（LaunchAgent 托管）' : '服务运行中 · 已开启开机自启';
}

async function loadSettings() {
  try {
    const j = await (await fetch('/api/settings')).json();
    autostartToggle.checked = Boolean(j.autostart);
    autostartToggle.disabled = false;
    dataDirPath.textContent = j.dataDir || '';
    portVal.textContent = j.port || '';
    verVal.textContent = 'v' + (j.version || '');
    renderSvcStatus(j);
  } catch (e) {
    svcStatus.className = 'set-status';
    svcStatus.textContent = '设置读取失败：' + e.message;
  }
}

autostartToggle.onchange = async function () {
  if (settingsBusy) return;
  settingsBusy = true;
  autostartToggle.disabled = true;
  var want = autostartToggle.checked;
  renderSvcStatus(null, want ? '正在开启开机自启，服务交接中…' : '正在关闭开机自启，服务交接中…');
  try {
    var r = await fetch('/api/settings', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ autostart: want }),
    });
    var j = await r.json();
    if (j && j.restarting) {
      // 服务交接（bootout/bootstrap）期间轮询设置状态，直到托管关系达到目标
      // launchd 可能延迟 spawn，旧实例会按住端口等待，故轮询窗口放宽到 50s
      for (var i = 0; i < 100; i++) {
        await new Promise(function (res) { setTimeout(res, 500); });
        try {
          var st = await (await fetch('/api/settings')).json();
          if (st && st.managed === want) break;
        } catch (e) { }
      }
    }
    await loadSettings();
  } catch (e) {
    svcStatus.className = 'set-status';
    svcStatus.textContent = '切换失败：' + e.message;
    try { await loadSettings(); } catch (e2) { }
  } finally {
    settingsBusy = false;
    autostartToggle.disabled = false;
  }
};
// ---------- 自定义 Provider（实现见 public/providers.mjs） ----------
mountProviders({
  onChanged: function () {
    // 提供方变动后重取模型目录：自定义提供方的模型立即出现在选择器里
    loadModels(true).then(renderTrigger);
  },
});
</script>
